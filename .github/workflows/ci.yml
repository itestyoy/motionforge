name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('packages/motionforge/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Typecheck, build, test
        working-directory: packages/motionforge
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run test
